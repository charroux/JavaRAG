spring:
  application:
    name: java-rag
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpassword
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Configuration pour le modèle d'IA
# Option 1: Utiliser Ollama en local (recommandé pour l'apprentissage)
ai:
  provider: ollama  # ou "openai"
  
  ollama:
    base-url: http://localhost:11434
    embedding-model: nomic-embed-text  # Modèle pour les embeddings
    chat-model: llama3.2  # Modèle pour la génération de texte
  
  # Option 2: Utiliser OpenAI (nécessite une clé API)
  openai:
    api-key: ${OPENAI_API_KEY:your-api-key-here}
    embedding-model: text-embedding-3-small
    chat-model: gpt-3.5-turbo

# Configuration du serveur
server:
  port: 8080

# Logging
logging:
  level:
    com.example.javarag: DEBUG
    org.hibernate.SQL: DEBUG
